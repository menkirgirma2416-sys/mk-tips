      body {
        font-family: var(--font-body);
        background-color: #f8fafc;
        color: #0f172a;
      }
      h1, h2, h3, h4, h5, h6 {

      }
      .bg-navy-gradient {
        background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #172554 100%);
      }
      .opportunity-card {
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      .opportunity-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      }
    </style>
  </head>
  <body>

      const INITIAL_OPPORTUNITIES = [

          funding_type: "Fully Funded",
          stipend: "€1,400 / month",
          description: "Joint Master's degree across multiple European universities with €1,400 monthly living stipend and travel grants.",
          official_website: "https://erasmus-plus.ec.europa.eu/opportunities/individuals/students/erasmus-mundus-joint-masters",

        },
        {
          id: "opp-chevening-uk",
          name: "Chevening UK Government Scholarships",
          provider: "UK Foreign, Commonwealth & Development Office",
          country: "United Kingdom",
          type: "Scholarship",
          degree_level: "Master's",
          field_of_study: "All Academic Fields",
          eligible_countries: "Ethiopia and over 160 Chevening countries",
          opening_date: "2026-09-08",
          deadline: "2026-11-03",
          status: "Upcoming",
          application_fee: false,
          fee_amount: 0,
          fee_status: "No Application Fee",
          alternative_english_accepted: false,
          moi_accepted: false,
          english_requirements: "Chevening no longer enforces a central English test requirement; applicants must meet chosen UK university criteria.",
          funding_type: "Fully Funded",
          stipend: "£1,350 - £1,650 / month",
          description: "Full UK government award for a 1-year Master's degree. Covers 100% tuition, monthly stipend, flights, and visa fees.",
          official_website: "https://www.chevening.org/",
          application_link: "https://www.chevening.org/apply/",
          featured: true,
          published: true
        },
        {
          id: "opp-swiss-government",
          name: "Swiss Government Excellence Scholarships (PhD & Research)",
          provider: "SERI Switzerland",
          country: "Switzerland",
          type: "Scholarship",
          degree_level: "PhD",
          field_of_study: "All Fields (ETH Zurich, EPFL, Swiss Universities)",
          eligible_countries: "Ethiopia and over 180 partner countries",
          opening_date: "2026-08-01",
          deadline: "2026-11-15",
          status: "Open",
          application_fee: false,
          fee_amount: 0,
          fee_status: "No Application Fee",
          alternative_english_accepted: true,
          moi_accepted: true,
          english_requirements: "Language of host university; professor supervision letter required.",
          funding_type: "Fully Funded",
          stipend: "CHF 1,920 - CHF 3,500 / month",
          description: "Swiss government research awards for PhD and Postdoctoral scholars at ETH Zurich, EPFL, and Swiss public universities.",
          official_website: "https://www.sbfi.admin.ch/sbfi/en/home/education/scholarships-and-grants/swiss-government-excellence-scholarships.html",
          application_link: "https://www.sbfi.admin.ch/sbfi/en/home/education/scholarships-and-grants/swiss-government-excellence-scholarships.html",
          featured: true,
          published: true
        }
      ];

      function App() {
        const [activePage, setActivePage] = useState('Home');
        const [searchQuery, setSearchQuery] = useState('');
        
        // Multi-Attribute Filter States
        const [selectedType, setSelectedType] = useState('All');
        const [selectedLevel, setSelectedLevel] = useState('All');
        const [selectedFunding, setSelectedFunding] = useState('All');
        const [selectedFee, setSelectedFee] = useState('All');
        const [selectedEnglish, setSelectedEnglish] = useState('All');
        const [selectedCountry, setSelectedCountry] = useState('All');
        const [selectedDeadline, setSelectedDeadline] = useState('All');

        const [selectedOpp, setSelectedOpp] = useState(null);
        
        // Admin Portal States
        const [isAdminOpen, setIsAdminOpen] = useState(false);
        const [adminPassword, setAdminPassword] = useState('');
        const [adminAuth, setAdminAuth] = useState(false);
        const [adminTab, setAdminTab] = useState('list');
        const [editingId, setEditingId] = useState(null);

        // Keyboard Shortcut (Ctrl + Shift + A) and URL parameter (?admin=true) for Administrator Access
        useEffect(() => {
          const handleKeyDown = (e) => {
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
              e.preventDefault();
              setIsAdminOpen(true);
            }
          };
          window.addEventListener('keydown', handleKeyDown);

          if (window.location.search.includes('admin=true')) {
            setIsAdminOpen(true);
          }

          return () => window.removeEventListener('keydown', handleKeyDown);
        }, []);

        // Persistent Database State
        const [opportunities, setOpportunities] = useState(() => {
          const saved = localStorage.getItem('mk_tips_opportunities');
          if (saved) { try { return JSON.parse(saved); } catch (e) { return INITIAL_OPPORTUNITIES; } }
          return INITIAL_OPPORTUNITIES;
        });

        useEffect(() => {
          localStorage.setItem('mk_tips_opportunities', JSON.stringify(opportunities));
        }, [opportunities]);

        const resetFilters = () => {
          setSelectedType('All');
          setSelectedLevel('All');
          setSelectedFunding('All');
          setSelectedFee('All');
          setSelectedEnglish('All');
          setSelectedCountry('All');
          setSelectedDeadline('All');
          setSearchQuery('');
        };

        const initialFormState = {
          name: '',
          provider: '',
          type: 'Scholarship',
          country: '',
          eligible_countries: 'Ethiopia and all international applicants',
          degree_level: "Master's",
          field_of_study: '',
          funding_type: 'Fully Funded',
          fee_status: 'No Application Fee',
          english_requirements: '',
          moi_accepted: false,
          opening_date: '',
          deadline: '',
          status: 'Open',
          description: '',
          full_description: '',
          eligibility_criteria: '',
          benefits: '',
          required_documents: '',
          application_process: '',
          official_website: '',
          application_link: '',
          featured: false,
          published: true
        };

        const [formData, setFormData] = useState(initialFormState);

        const handleSaveOpportunity = (e) => {
          e.preventDefault();
          const oppData = {
            ...formData,
            id: editingId || `opp-custom-${Date.now()}`,
            application_fee: formData.fee_status === 'Application Fee Required',
            fee_amount: formData.fee_status === 'No Application Fee' ? 0 : 50,
            last_verified: new Date().toISOString().split('T')[0]
          };

          if (editingId) {
            setOpportunities(prev => prev.map(o => o.id === editingId ? oppData : o));
          } else {
            setOpportunities(prev => [oppData, ...prev]);
          }

          setFormData(initialFormState);
          setEditingId(null);
          setAdminTab('list');
        };

        const handleStartEdit = (opp) => {
          setEditingId(opp.id);
          setFormData({ ...initialFormState, ...opp });
          setAdminTab('edit');
        };

        const handleDeleteOpp = (id) => {
          if (confirm('Are you sure you want to delete this opportunity record permanently?')) {
            setOpportunities(prev => prev.filter(o => o.id !== id));
          }
        };

        const handleTogglePublish = (id) => {
          setOpportunities(prev => prev.map(o => o.id === id ? { ...o, published: o.published === false ? true : false } : o));
        };

        const handleToggleFeature = (id) => {
          setOpportunities(prev => prev.map(o => o.id === id ? { ...o, featured: !o.featured } : o));
        };

        const today = new Date();

        const filtered = opportunities.filter(opp => {
          if (opp.published === false) return false;
          
          if (selectedType !== 'All' && opp.type !== selectedType) return false;
          if (selectedLevel !== 'All' && opp.degree_level !== selectedLevel) return false;
          if (selectedFunding !== 'All' && !opp.funding_type.toLowerCase().includes(selectedFunding.toLowerCase())) return false;
          if (selectedFee !== 'All') {
            if (selectedFee === 'No Application Fee' && (opp.application_fee || opp.fee_amount > 0)) return false;
            if (selectedFee === 'Application Fee Required' && !opp.application_fee) return false;
          }
          if (selectedEnglish !== 'All') {
            if (selectedEnglish === 'MOI / Alternative English Proof' && !opp.moi_accepted) return false;
          }
          if (selectedCountry !== 'All' && !opp.country.toLowerCase().includes(selectedCountry.toLowerCase())) return false;

          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase();
            return (opp.name && opp.name.toLowerCase().includes(q)) || 
                   (opp.country && opp.country.toLowerCase().includes(q)) || 
                   (opp.provider && opp.provider.toLowerCase().includes(q)) ||
                   (opp.field_of_study && opp.field_of_study.toLowerCase().includes(q));
          }
          return true;
        });

        const activeFilterCount = (selectedType !== 'All' ? 1 : 0) + 
                                  (selectedLevel !== 'All' ? 1 : 0) + 
                                  (selectedFunding !== 'All' ? 1 : 0) + 
                                  (selectedFee !== 'All' ? 1 : 0) + 
                                  (selectedEnglish !== 'All' ? 1 : 0) + 
                                  (selectedCountry !== 'All' ? 1 : 0) + 
                                  (selectedDeadline !== 'All' ? 1 : 0) +
                                  (searchQuery.trim() !== '' ? 1 : 0);

        return (
          <div className="min-h-screen flex flex-col">
            {/* Top Announcement Bar */}
            <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
              <div className="bg-slate-900 text-white text-xs py-2 px-4 text-center flex flex-wrap items-center justify-center gap-3">
                <span>🎓 <strong>MK Tips</strong> — Your Guide to Global Opportunities | Discover • Prepare • Apply • Achieve</span>
                <div className="flex gap-2">
                  <a href="https://t.me/mktips1224" target="_blank" rel="noopener" className="bg-sky-500 text-white px-2.5 py-0.5 rounded-full font-bold">✈️ Join Telegram</a>
                  <a href="https://forms.gle/gwHnj7gJvWNfUMSH7" target="_blank" rel="noopener" className="bg-amber-500 text-slate-950 px-2.5 py-0.5 rounded-full font-extrabold">Apply With Us ↗</a>
                </div>
              </div>

              {/* Navbar Header (Public Admin Button Removed) */}
              <div className="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between gap-3">
                <div className="flex items-center gap-3 cursor-pointer shrink-0" onClick={() => setActivePage('Home')}>
                  <img 
                    src="./assets/images/mk-tips-logo.png" 
                    alt="MK Tips Official Logo" 
                    onError={(e) => { e.target.src = './public/assets/images/mk-tips-logo.png'; }}
                    className="h-12 object-contain" 
                  />
                </div>

                {/* SINGLE HORIZONTAL ROW NAVIGATION ON DESKTOP */}
                <nav className="hidden lg:flex items-center gap-1 flex-nowrap shrink-0">
                  {[
                    { id: 'Home', label: 'HOME' },
                    { id: 'Opportunities', label: 'OPPORTUNITIES' },
                    { id: 'Services', label: 'SERVICES' },
                    { id: 'ApplyWithUs', label: 'APPLY WITH US' },
                    { id: 'Ebooks', label: 'MK EBOOKS' },
                    { id: 'About', label: 'ABOUT' },
                    { id: 'Contact', label: 'CONTACT' }
                  ].map((page) => (
                    <button
                      key={page.id}
                      onClick={() => setActivePage(page.id)}
                      className={`px-3.5 py-2 rounded-xl text-xs font-extrabold whitespace-nowrap transition-all ${activePage === page.id ? 'bg-blue-50 text-blue-700' : 'text-slate-700 hover:text-blue-600'}`}
                    >
                      {page.label}
                    </button>
                  ))}
                </nav>

                <div className="flex items-center gap-2 shrink-0">
                  <a href="https://forms.gle/6EermLr5nm9ef3y98" target="_blank" rel="noopener" className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold px-4 py-2.5 rounded-xl shadow">
                    Apply Now ↗
                  </a>
                </div>
              </div>
            </header>

            {/* PAGE 1: OPPORTUNITIES */}
            {activePage === 'Opportunities' && (
              <main className="max-w-7xl mx-auto px-4 py-8 flex-1 w-full space-y-8">
                {/* Visual Filter Panel */}
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                  <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                    <div>
                      <div className="flex items-center gap-2">
                        <h2 className="text-2xl font-extrabold text-slate-900">Opportunity Finder & Filters</h2>
                        {activeFilterCount > 0 && (
                          <span className="bg-blue-600 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full">{activeFilterCount} Active</span>
                        )}
                      </div>
                      <p className="text-xs text-slate-500">Filter verified scholarships, fellowships, internships, conferences, and courses ({filtered.length} results).</p>
                    </div>

                    {activeFilterCount > 0 && (
                      <button onClick={resetFilters} className="bg-red-50 text-red-600 border border-red-200 font-extrabold text-xs px-3.5 py-1.5 rounded-xl">
                        Clear Filters
                      </button>
                    )}
                  </div>

                  {/* 7 Filter Select Controls */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 text-xs font-bold">
                    <div>
                      <label className="block text-[10px] text-slate-400 uppercase mb-1">Opportunity Type</label>
                      <select value={selectedType} onChange={(e) => setSelectedType(e.target.value)} className="w-full border border-slate-300 p-2.5 rounded-xl font-bold bg-slate-50">
                        <option value="All">All Types</option>
                        <option value="Scholarship">Scholarships</option>
                        <option value="Fellowship">Fellowships</option>
                        <option value="Internship">Internships</option>
                        <option value="Conference">Conferences</option>
                        <option value="Online Course">Online Courses</option>
                        <option value="Grant">Grants</option>
                        <option value="Exchange Program">Exchange Programs</option>
                        <option value="Research Opportunity">Research Opportunities</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-[10px] text-slate-400 uppercase mb-1">Study Level</label>
                      <select value={selectedLevel} onChange={(e) => setSelectedLevel(e.target.value)} className="w-full border border-slate-300 p-2.5 rounded-xl font-bold bg-slate-50">
                        <option value="All">All Levels</option>
                        <option value="Bachelor's">Bachelor's</option>
                        <option value="Master's">Master's</option>
                        <option value="PhD">PhD</option>
                        <option value="Postdoctoral">Postdoctoral</option>
                        <option value="Other">Other</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-[10px] text-slate-400 uppercase mb-1">Funding</label>
                      <select value={selectedFunding} onChange={(e) => setSelectedFunding(e.target.value)} className="w-full border border-slate-300 p-2.5 rounded-xl font-bold bg-slate-50">
                        <option value="All">All Funding</option>
                        <option value="Fully Funded">Fully Funded</option>
                        <option value="Partially Funded">Partially Funded</option>
                        <option value="Tuition Fee Only">Tuition Fee Only</option>
                        <option value="Stipend">Stipend Only</option>
                        <option value="Free">Free</option>
                        <option value="Unfunded">Unfunded</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-[10px] text-slate-400 uppercase mb-1">Application Fee</label>
                      <select value={selectedFee} onChange={(e) => setSelectedFee(e.target.value)} className="w-full border border-slate-300 p-2.5 rounded-xl font-bold bg-slate-50">
                        <option value="All">All Fees</option>
                        <option value="No Application Fee">No Application Fee ($0)</option>
                        <option value="Application Fee Required">Application Fee Required</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {filtered.map(opp => {
                    const daysLeft = Math.ceil((new Date(opp.deadline) - today) / (1000 * 60 * 60 * 24));
                    return (
                      <div key={opp.id} className="opportunity-card bg-white border border-slate-200 rounded-2xl p-6 flex flex-col justify-between shadow-sm">
                        <div>
                          <div className="flex items-center justify-between gap-2 mb-3">
                            <span className="bg-slate-100 text-slate-700 text-xs font-bold px-2.5 py-1 rounded-lg">📍 {opp.country}</span>
                            <span className="bg-blue-50 text-blue-700 text-xs font-bold px-2.5 py-1 rounded-lg">{opp.type}</span>
                          </div>
                          <h3 onClick={() => setSelectedOpp(opp)} className="text-lg font-extrabold text-slate-900 hover:text-blue-600 cursor-pointer mb-2 leading-snug">
                            {opp.name}
                          </h3>
                          <p className="text-xs font-semibold text-slate-500 mb-3">🏛️ {opp.provider}</p>
                          <p className="text-xs text-slate-600 mb-4 line-clamp-3 leading-relaxed">"{opp.description}"</p>
                        </div>
                        <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
                          <div>
                            <div className="text-xs font-bold text-slate-700">📅 {opp.deadline_display || opp.deadline}</div>
                            <div className="text-xs font-semibold text-blue-600">{opp.deadline_display ? 'Program Specific' : `${daysLeft} days left`}</div>
                          </div>
                          <button onClick={() => setSelectedOpp(opp)} className="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl text-xs">
                            View Details →
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </main>
            )}

            {/* PAGE 2: SERVICES */}
            {activePage === 'Services' && (
              <main className="max-w-7xl mx-auto px-4 py-10 flex-1 w-full space-y-8">
                <div className="bg-slate-900 text-white rounded-3xl p-8 max-w-7xl mx-auto text-left relative overflow-hidden shadow-xl">
                  <div className="max-w-3xl space-y-3">
                    <span className="bg-blue-600 text-white text-xs font-extrabold px-3.5 py-1 rounded-full inline-block">
                      ✨ MK TIPS GUIDANCE SERVICES
                    </span>
                    <h2 className="text-3xl font-extrabold text-white">Our Services</h2>
                    <p className="text-slate-300 text-sm leading-relaxed">
                      Practical guidance and structured application support to help you navigate admissions, scholarships, document preparation, and visa stages with clarity and confidence.
                    </p>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {[
                    { title: "University Application & Admission", badge: "ADMISSION SUPPORT", color: "blue", desc: "University selection & admission portal guidance.", link: "https://forms.gle/gwHnj7gJvWNfUMSH7", text: "Apply With Us Form ↗", isTg: false },
                    { title: "Personal Mentorship", badge: "1-ON-1 GUIDANCE", color: "emerald", desc: "1-on-1 strategy & application planning.", link: "https://t.me/Mk_8958", text: "Contact Me on Telegram ✈️", isTg: true },
                    { title: "Document Preparation Support", badge: "AUTHENTIC PROFILES", color: "amber", desc: "CV, motivation letter & recommendation formatting.", link: "https://t.me/Mk_8958", text: "Contact Me on Telegram ✈️", isTg: true },
                    { title: "Full Application Support", badge: "END-TO-END", color: "purple", desc: "End-to-end guidance to portal submission.", link: "https://forms.gle/gwHnj7gJvWNfUMSH7", text: "Apply With MK Tips ↗", isTg: false },

                            <input type="text" required value={formData.country} onChange={(e) => setFormData({ ...formData, country: e.target.value })} className="w-full border border-slate-300 p-2.5 rounded-xl" />
                          </div>
                          <div>
                            <label className="block text-[11px] font-extrabold text-slate-500 uppercase mb-1">Eligible Countries</label>
                            <input type="text" value={formData.eligible_countries} onChange={(e) => setFormData({ ...formData, eligible_countries: e.target.value })} className="w-full border border-slate-300 p-2.5 rounded-xl" />
                          </div>
                          <div>
                            <label className="block text-[11px] font-extrabold text-slate-500 uppercase mb-1">Opportunity Type *</label>
                            <select value={formData.type} onChange={(e) => setFormData({ ...formData, type: e.target.value })} className="w-full border border-slate-300 p-2.5 rounded-xl font-bold">
                              <option value="Scholarship">Scholarship</option>
                              <option value="Fellowship">Fellowship</option>
                              <option value="Internship">Internship</option>
                              <option value="Conference">Conference</option>
                              <option value="Online Course">Online Course</option>
                              <option value="Grant">Grant</option>
                              <option value="Exchange Program">Exchange Program</option>
                              <option value="Research Opportunity">Research Opportunity</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-[11px] font-extrabold text-slate-500 uppercase mb-1">Study Level *</label>
                            <select value={formData.degree_level} onChange={(e) => setFormData({ ...formData, degree_level: e.target.value })} className="w-full border border-slate-300 p-2.5 rounded-xl font-bold">
                              <option value="Bachelor's">Bachelor's</option>
                              <option value="Master's">Master's</option>
                              <option value="PhD">PhD</option>
                              <option value="Postdoctoral">Postdoctoral</option>
                              <option value="Professional">Professional</option>
                              <option value="Other">Other / Multiple</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-[11px] font-extrabold text-slate-500 uppercase mb-1">Field / Subject</label>
                            <input type="text" value={formData.field_of_study} onChange={(e) => setFormData({ ...formData, field_of_study: e.target.value })} className="w-full border border-slate-300 p-2.5 rounded-xl" />
                          </div>
                          <div>
                            <label className="block text-[11px] font-extrabold text-slate-500 uppercase mb-1">Funding Type *</label>
                            <select value={formData.funding_type} onChange={(e) => setFormData({ ...formData, funding_type: e.target.value })} className="w-full border border-slate-300 p-2.5 rounded-xl font-bold">
                              <option value="Fully Funded">Fully Funded</option>
                              <option value="Partially Funded">Partially Funded</option>
                              <option value="Tuition Fee Only">Tuition Fee Only</option>
                              <option value="Stipend Only">Stipend Only</option>
                              <option value="Free">Free</option>
                              <option value="Unfunded">Unfunded</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-[11px] font-extrabold text-slate-500 uppercase mb-1">Application Fee *</label>
                            <select value={formData.fee_status} onChange={(e) => setFormData({ ...formData, fee_status: e.target.value })} className="w-full border border-slate-300 p-2.5 rounded-xl font-bold">
                              <option value="No Application Fee">No Application Fee ($0)</option>
                              <option value="Application Fee Required">Application Fee Required</option>
                              <option value="Not Specified">Not Specified</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-[11px] font-extrabold text-slate-500 uppercase mb-1">English Requirement</label>
                            <input type="text" value={formData.english_requirements} onChange={(e) => setFormData({ ...formData, english_requirements: e.target.value })} placeholder="e.g. MOI Accepted or IELTS 6.5" className="w-full border border-slate-300 p-2.5 rounded-xl" />
                          </div>
                          <div>
                            <label className="block text-[11px] font-extrabold text-slate-500 uppercase mb-1">Opening Date</label>
                            <input type="date" value={formData.opening_date} onChange={(e) => setFormData({ ...formData, opening_date: e.target.value })} className="w-full border border-slate-300 p-2.5 rounded-xl font-bold" />
                          </div>
                          <div>
                            <label className="block text-[11px] font-extrabold text-slate-500 uppercase mb-1">Deadline Date *</label>
                            <input type="date" required value={formData.deadline} onChange={(e) => setFormData({ ...formData, deadline: e.target.value })} className="w-full border border-slate-300 p-2.5 rounded-xl font-bold" />
                          </div>
                          <div>
                            <label className="block text-[11px] font-extrabold text-slate-500 uppercase mb-1">Status *</label>
                            <select value={formData.status} onChange={(e) => setFormData({ ...formData, status: e.target.value })} className="w-full border border-slate-300 p-2.5 rounded-xl font-bold">
                              <option value="Open">OPEN</option>
                              <option value="Upcoming">UPCOMING</option>
                              <option value="Closed">CLOSED</option>
                            </select>
                          </div>
                          <div className="md:col-span-2">
                            <label className="block text-[11px] font-extrabold text-slate-500 uppercase mb-1">Brief Description (Card Summary) *</label>
                            <textarea required rows="2" value={formData.description} onChange={(e) => setFormData({ ...formData, description: e.target.value })} placeholder="Brief summary displayed on cards..." className="w-full border border-slate-300 p-2.5 rounded-xl" />
                          </div>
                          <div className="md:col-span-2 flex flex-wrap gap-4 items-center py-2">
                            <label className="flex items-center gap-2 cursor-pointer">
                              <input type="checkbox" checked={formData.moi_accepted} onChange={(e) => setFormData({ ...formData, moi_accepted: e.target.checked })} className="w-4 h-4" />
                              <span>MOI / Medium of Instruction Accepted</span>
                            </label>
                            <label className="flex items-center gap-2 cursor-pointer">
                              <input type="checkbox" checked={formData.featured} onChange={(e) => setFormData({ ...formData, featured: e.target.checked })} className="w-4 h-4" />
                              <span>Feature on Homepage</span>
                            </label>
                            <label className="flex items-center gap-2 cursor-pointer">
                              <input type="checkbox" checked={formData.published} onChange={(e) => setFormData({ ...formData, published: e.target.checked })} className="w-4 h-4" />
                              <span>Publish Immediately</span>
                            </label>
                          </div>
                          <div className="md:col-span-2 flex justify-end gap-3 pt-4 border-t border-slate-200">
                            <button type="button" onClick={() => setAdminTab('list')} className="bg-slate-100 text-slate-700 px-4 py-2.5 rounded-xl font-bold text-xs">Cancel</button>
                            <button type="submit" className="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-extrabold text-xs shadow-md">Save Opportunity Record</button>
                          </div>
                        </form>
                      )}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* COMPACT FOOTER (SERVICES COLUMN REMOVED) */}
            <footer className="bg-slate-900 text-white py-8 border-t border-slate-800 text-xs text-slate-400">
              <div className="max-w-7xl mx-auto px-4 space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-4 gap-6 items-start">
                  <div className="md:col-span-2 space-y-2">
                    <img 
                      src="./assets/images/mk-tips-logo.png" 
                      alt="MK Tips Logo" 
                      onError={(e) => { e.target.src = './public/assets/images/mk-tips-logo.png'; }}
                      className="max-h-11 object-contain mb-1" 
                    />
                    <p className="text-sm font-bold text-white">MK Tips — Your Guide to Global Opportunities</p>
                    <p className="text-xs text-slate-400 max-w-sm">Discover global opportunities, understand requirements, prepare application documents, and navigate the application journey.</p>
                  </div>
                  <div>
                    <h4 className="font-extrabold text-white mb-2 uppercase text-[11px] tracking-wider">Navigation & Resources</h4>
                    <div className="flex flex-col gap-1.5 text-slate-300">
                      <button onClick={() => setActivePage('Opportunities')} className="text-left hover:text-blue-400">All Opportunities</button>
                      <button onClick={() => setActivePage('Ebooks')} className="text-left hover:text-blue-400">MK Ebooks</button>
                      <button onClick={() => setActivePage('ApplyWithUs')} className="text-left hover:text-blue-400">Apply With Us</button>
                      <button onClick={() => setActivePage('About')} className="text-left hover:text-blue-400">About MK Tips</button>
                      <button onClick={() => setActivePage('Contact')} className="text-left hover:text-blue-400">Contact</button>
                    </div>
                  </div>
                  <div>
                    <h4 className="font-extrabold text-white mb-2 uppercase text-[11px] tracking-wider">Connect & Community</h4>
                    <div className="flex flex-col gap-1.5 text-slate-300">
                      <a href="https://t.me/mktips1224" target="_blank" rel="noopener" className="hover:text-sky-400">Telegram Channel @mktips1224</a>
                      <a href="https://t.me/Mk_8958" target="_blank" rel="noopener" className="hover:text-amber-400">Telegram Contact @Mk_8958</a>
                      <a href="https://www.tiktok.com/@scholarship2112?_r=1&_t=ZS-98lyiYFivae" target="_blank" rel="noopener" className="hover:text-white">TikTok @scholarship2112</a>
                      <a href="https://ye-buna.com/mktips" target="_blank" rel="noopener" className="hover:text-blue-400">Ye-Buna Store</a>
                    </div>
                  </div>
                </div>
                <div className="pt-4 border-t border-slate-800 flex flex-col sm:flex-row justify-between items-center text-[11px] text-slate-500 gap-2">
                  <p>© 2026 MK Tips. All rights reserved.</p>
                  <p>Discover • Prepare • Apply • Achieve</p>
                </div>
              </div>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
